<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pattern integration fixture</title><link rel="stylesheet" href="../../styles/app.css"><script type="module" src="pattern-host.mjs"></script></head>
<body><main class="ds-shell"><h1>Independent host components</h1>
<table id="host-table"><caption>Host records</caption><tbody><tr><td>Host cell</td></tr></tbody></table>
